<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오늘의 루틴</title>
<link rel="stylesheet" href="../shared/common.css" />
<link rel="manifest" href="../manifest.json" />
<style>
  .slot-title { margin: 18px 0 8px; color: var(--color-graphite); font-size: 15px; font-weight: 700; }
  .sync-status { min-height:20px; text-align:right; font-size:12px; color:var(--color-silver); }
  .flying-star { position:fixed; z-index:200; font-size:34px; pointer-events:none; transition:transform .48s cubic-bezier(.2,.8,.2,1),opacity .48s; }
  .growth-level { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .growth-percent { color:#a56700; font-size:22px; font-weight:900; }
</style>
</head>
<body class="student-routine-page">
<div class="container">
  <div id="loginView" class="student-login-shell" style="display:none;">
    <div class="student-login-brand">
      <span class="student-login-icon" aria-hidden="true">⭐</span>
      <h1>오늘의 루틴</h1>
      <p id="studentLoginClassName" class="helper-text">선생님이 알려준 내 코드를 입력해요.</p>
    </div>
    <div class="card student-login-card">
      <h2>내 코드를 입력하세요</h2>
      <label for="loginCode" style="display:block; margin-bottom:6px; font-weight:800;">학생 코드 4자리</label>
      <input id="loginCode" class="student-code-input" placeholder="0000" maxlength="4" inputmode="numeric" autocomplete="one-time-code" enterkeyhint="go" onkeydown="if(event.key==='Enter') login()" />
      <p class="helper-text" style="text-align:center;">루틴과 나의 휘장 성장만 확인할 수 있어요.</p>
      <button style="width:100%; margin-top:14px;" onclick="login()">내 루틴 시작하기</button>
    </div>
  </div>

  <div id="mainView" style="display:none;">
    <div class="topbar">
      <h1 id="greeting">안녕!</h1>
      <button class="secondary student-finish-button" onclick="returnToBoard()">확인 끝! 전자칠판으로</button>
    </div>
    <div id="pointsBar" style="margin-bottom:10px; font-size:14px; color:var(--color-graphite); font-weight:700;"></div>
    <div id="syncStatus" class="sync-status"></div>
    <div id="starGaugeCard" class="card star-gauge-card"></div>
    <div id="encourageBanner"></div>
    <div id="routineList"></div>
  </div>
</div>

<audio id="doneSound" preload="auto">
  <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
</audio>
<div class="toast" id="toast"></div>

<script src="../shared/api.js"></script>
<script src="../shared/tiers.js"></script>
<script src="../shared/student-growth-notice.js"></script>
<script>
let studentId = sessionStorage.getItem('studentId');
let classId = sessionStorage.getItem('studentClassId');
let state = null;
let syncing = false;
let syncTimer = null;
let lastLoadedAt = 0;

function queueKey() { return `routine-sync-${studentId}`; }
function readQueue() { try { return JSON.parse(localStorage.getItem(queueKey()) || '{}'); } catch (_) { return {}; } }
function writeQueue(queue) { localStorage.setItem(queueKey(), JSON.stringify(queue)); }
function eventId() { return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`; }

function showLogin() {
  document.getElementById('loginView').style.display = 'block';
  document.getElementById('mainView').style.display = 'none';
  loadLoginClassName();
}
async function loadLoginClassName() {
  const label = document.getElementById('studentLoginClassName');
  if (!classId) { label.textContent = '선생님이 알려준 내 코드를 입력해요.'; return; }
  try {
    const cls = await API.get(`/api/classes/${classId}`);
    label.textContent = `${cls.name} · 선생님이 알려준 내 코드를 입력해요.`;
  } catch (_) {
    label.textContent = '선생님이 알려준 내 코드를 입력해요.';
  }
}
function showMain() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('mainView').style.display = 'block';
  document.getElementById('greeting').textContent = `안녕, ${sessionStorage.getItem('studentNickname')}!`;
  loadStudentState();
}

async function loadStudentState() {
  try {
    state = await API.get(`/api/checks/student-state?student_id=${studentId}`);
    lastLoadedAt = Date.now();
    renderState();
    StudentGrowthNotice.show(state.unseen_adjustments, {
      studentId,
      growth: state.growth,
      onConfirmed: () => { state.unseen_adjustments = []; }
    });
    flushQueue();
  } catch (e) {
    document.getElementById('syncStatus').textContent = '연결을 확인하고 다시 시도할게요';
  }
}

function renderState() {
  document.getElementById('pointsBar').textContent = state.finalized ? '오늘 성장은 자동 마감되었어요' : '루틴을 누르면 별이 성장 바로 들어가요';
  renderRoutines(state.routines);
  renderGrowth();
  renderEncouragements(state.encouragements || []);
}

function renderEncouragements(list) {
  const box = document.getElementById('encourageBanner');
  if (!list.length) { box.innerHTML = ''; return; }
  const m = list[0];
  box.innerHTML = `<div class="card" style="background:#fff9e0; border:2px solid var(--color-sunshine-yellow);">
    💌 ${m.message}
    <button class="secondary" style="margin-left:10px; font-size:12px; padding:4px 8px;" onclick="readEncouragement(${m.id})">확인</button>
  </div>`;
}

async function readEncouragement(id) {
  await API.post(`/api/encouragements/${id}/read`);
  state.encouragements = state.encouragements.filter(message => Number(message.id) !== Number(id));
  renderEncouragements(state.encouragements);
}

async function login() {
  const code = document.getElementById('loginCode').value.trim();
  if (!code) return;
  try {
    const s = await API.post('/api/students/login', { login_code: code });
    studentId = s.id;
    classId = s.class_id;
    sessionStorage.setItem('studentId', studentId);
    sessionStorage.setItem('studentClassId', classId);
    sessionStorage.setItem('studentNickname', s.nickname);
    showMain();
  } catch (e) {
    alert('코드를 다시 확인해주세요');
  }
}

function logout() {
  flushQueue(true);
  sessionStorage.removeItem('studentId');
  sessionStorage.removeItem('studentNickname');
  showLogin();
}

function returnToBoard() {
  flushQueue(true);
  sessionStorage.removeItem('studentId');
  sessionStorage.removeItem('studentNickname');
  location.href = '../teacher/board.html';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function renderRoutines(routines) {
  const slots = {};
  routines.forEach(r => {
    slots[r.time_slot] = slots[r.time_slot] || [];
    slots[r.time_slot].push(r);
  });

  const order = ['아침', '오전', '오후', '하루'];
  const keys = Object.keys(slots).sort((a, b) => order.indexOf(a) - order.indexOf(b));

  const list = document.getElementById('routineList');
  list.innerHTML = keys.map(slot => `
    <div class="slot-title">${slot}</div>
    ${slots[slot].map(r => {
      const done = r.check.completed;
      return `<div class="routine-item">
        <div class="icon">${r.icon}</div>
        <div class="title">
          ${r.title}<span id="count-${r.id}">${r.target_count > 1 ? ` (${r.check.count}/${r.target_count})` : ''}</span>
          ${r.carried_over ? '<div style="font-size:13px; color:#c98a1e; margin-top:2px;">어제 못한 일이에요, 오늘 해볼까요?</div>' : ''}
          ${r.not_started && !done ? `<div style="font-size:13px; color:#c0392b; margin-top:2px;">시작 시간(${r.start_time}) 전이에요</div>` : ''}
          ${r.locked && !r.not_started && !done ? `<div style="font-size:13px; color:#c0392b; margin-top:2px;">마감(${r.deadline_time}) 지났어요</div>` : ''}
        </div>
        <div class="check-btn ${done ? 'done' : ''} ${r.locked ? 'locked' : ''}" data-target="${r.target_count}" data-count="${r.check.count || 0}" onclick="${r.locked ? '' : `toggle(${r.id}, this)`}">${done ? '✓' : (r.locked ? '🔒' : '')}</div>
      </div>`;
    }).join('')}
  `).join('');
}

function renderGrowth(animate = false) {
  const growth = state?.growth;
  const box = document.getElementById('starGaugeCard');
  if (!growth) { box.innerHTML = '<strong>나의 휘장</strong><p>휘장 정보를 준비하고 있어요.</p>'; return; }
  let level = Number(growth.level || 1);
  let progress = Number(growth.progress_xp || 0);
  const target = Math.max(1, Number(growth.target_xp || 25));
  if (!state.finalized) {
    const completed = state.routines.filter(routine => routine.check?.completed).length;
    progress += completed;
    while (progress >= target) { progress -= target; level += 1; }
  }
  const pct = Math.max(0, Math.min(100, Math.round(progress / target * 100)));
  const tier = GrowthTiers.get(level);
  const message = growth.is_absent ? '오늘은 성장 게이지가 쉬어가요.'
    : growth.decay_warning ? '꾸준함 게이지가 잠들기 직전이에요. 오늘 루틴으로 깨워주세요!'
    : state.finalized ? '오늘의 휘장 성장이 확정되었어요.'
    : level > Number(growth.level) ? '자동 마감 후 새 휘장과 보상권이 확정돼요!'
    : '완료한 별은 자동 마감 시간에 확정돼요.';
  box.innerHTML = `<div class="growth-tier-heading">
      ${GrowthTiers.badge(level, 'tier-badge-lg')}
      <div class="growth-tier-copy"><span class="growth-tier-name">${tier.displayName}</span><span class="growth-tier-chapter">${tier.chapter}</span></div>
      <span class="growth-percent">${pct}%</span>
    </div>
    <div class="star-gauge-track" style="margin:10px 0 5px;"><div class="star-gauge-fill" style="width:${pct}%;${animate?'transition:width .45s ease;':''}"></div></div>
    <div style="font-size:13px;color:var(--color-graphite);">다음: ${tier.nextName} · ${message} · 보상권 🎟️ ${growth.tickets}장</div>`;
}

function flyStar(el) {
  const target = document.getElementById('starGaugeCard');
  const from = el.getBoundingClientRect();
  const to = target.getBoundingClientRect();
  const star = document.createElement('div');
  star.className = 'flying-star'; star.textContent = '⭐';
  star.style.left = `${from.left}px`; star.style.top = `${from.top}px`;
  document.body.appendChild(star);
  requestAnimationFrame(() => {
    star.style.transform = `translate(${to.left + to.width/2 - from.left}px,${to.top + to.height/2 - from.top}px) scale(.25)`;
    star.style.opacity = '0';
  });
  setTimeout(() => { star.remove(); renderGrowth(true); }, 480);
}

function toggle(routineId, el) {
  const routine = state.routines.find(item => Number(item.id) === Number(routineId));
  if (!routine || routine.locked) return;
  const wasDone = !!routine.check.completed;
  const target = Math.max(1, Number(routine.target_count || 1));
  const previousCount = Number(routine.check.count || 0);
  const count = wasDone ? 0 : Math.min(target, previousCount + 1);
  const completed = count >= target;
  routine.check.count = count;
  routine.check.completed = completed;
  el.dataset.count = count;
  el.classList.toggle('done', completed);
  el.textContent = completed ? '✓' : '';
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 200);
  const countEl = document.getElementById(`count-${routineId}`);
  if (countEl) countEl.textContent = target > 1 ? ` (${count}/${target})` : '';
  if (completed && !wasDone) {
    document.getElementById('doneSound').play().catch(() => {});
    showToast('잘했어요! 별이 성장으로 바뀌어요 ⭐');
    flyStar(el);
  } else renderGrowth(true);
  queueSync(routine);
}

function queueSync(routine) {
  const queue = readQueue();
  queue[routine.id] = { event_id:eventId(), routine_id:routine.id, student_id:Number(studentId), count:Number(routine.check.count || 0), completed:!!routine.check.completed };
  writeQueue(queue);
  document.getElementById('syncStatus').textContent = '저장 중…';
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => flushQueue(), Object.keys(queue).length >= 5 ? 50 : 900);
}

async function flushQueue(keepalive = false) {
  if (syncing || !studentId) return;
  const queue = readQueue();
  const events = Object.values(queue);
  if (!events.length) { document.getElementById('syncStatus').textContent = ''; return; }
  syncing = true;
  try {
    const response = await fetch('/api/checks/sync', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({events}), credentials:'same-origin', keepalive });
    if (!response.ok) { const error=await response.json().catch(()=>({})); throw Object.assign(new Error(error.error||'저장 실패'),{status:response.status}); }
    const result = await response.json();
    const latest = readQueue();
    events.forEach(event => { if (latest[event.routine_id]?.event_id === event.event_id) delete latest[event.routine_id]; });
    writeQueue(latest);
    document.getElementById('syncStatus').textContent = '저장됨 ✓';
    if (state?.student) state.student.points = result.points;
  } catch (error) {
    document.getElementById('syncStatus').textContent = error.status === 409 ? '자동 마감되어 최종 상태를 불러옵니다' : '연결되면 자동으로 저장할게요';
    if (error.status === 409) { localStorage.removeItem(queueKey()); setTimeout(loadStudentState, 500); }
    else setTimeout(() => flushQueue(), 10000);
  } finally { syncing = false; }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushQueue(true);
  else if (studentId && Date.now() - lastLoadedAt > 5*60*1000) loadStudentState();
});
window.addEventListener('pagehide', () => flushQueue(true));

if (studentId) showMain(); else showLogin();
</script>
</body>
</html>
